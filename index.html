<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>טופס בדיקה</title>
</head>
<body style="direction: rtl; font-family: sans-serif; padding: 40px; max-width: 500px; margin: auto; background: #f0f4f8;">

  <h2>טופס שליחה לבדיקה</h2>

  <form id="eventForm">
    <label>אירוע:
      <select id="eventSelect" required>
        <option value="">בחר אירוע</option>
        <option value="אירוע בדיקה 1">אירוע בדיקה 1</option>
        <option value="אירוע בדיקה 2">אירוע בדיקה 2</option>
      </select>
    </label><br>

    <label>קישור:
      <input type="url" id="referenceLink" required>
    </label><br>

    <label>שם:
      <input type="text" id="nameInput" required>
    </label><br>

    <label>זמן:
      <input type="datetime-local" id="referenceTime" required>
    </label><br><br>

    <button type="submit">שלח</button>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("eventForm");

      form.addEventListener("submit", e => {
        e.preventDefault();

        const event = document.getElementById("eventSelect").value;
        const link = document.getElementById("referenceLink").value;
        const name = document.getElementById("nameInput").value;
        const time = document.getElementById("referenceTime").value;

        if (!event || !link || !name || !time) {
          alert("נא למלא את כל השדות");
          return;
        }

        const formData = new URLSearchParams();
        formData.append("event", event);
        formData.append("link", link);
        formData.append("name", name);
        formData.append("time", time);

        console.log("שולח נתונים...", formData.toString());

        fetch("https://script.google.com/macros/s/AKfycbxuSQuwfXkfPZl8opHXqHcn5LvThsc-_Fr6e8flil0Z-8FQrIulmwS8yE7I0UfrD0Yw/exec", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        })
        .then(res => res.text())
        .then(resText => {
          console.log("תגובה מהשרת:", resText);
          alert("נשלח בהצלחה!");
          form.reset();
        })
        .catch(err => {
          console.error("שגיאה בשליחה:", err);
          alert("שגיאה בשליחה. ראה קונסול.");
        });
      });
    });
  </script>

</body>
</html>
