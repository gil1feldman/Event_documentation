<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>תיעוד התייחסות לאירועים חשובים</title>
  <style>
    html, body, h2 {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      direction: rtl;
      background: linear-gradient(to right, #eef2f3, #8dc6ff);
      display: flex;
      justify-content: center;
      padding: 0 20px 20px;
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #0A3D91;
      margin-bottom: 30px;
      font-size: 28px;
      text-align: center;
    }

    label {
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0 8px;
      display: block;
      color: #333;
      text-align: right;
    }

    select, input {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 0 auto 20px auto;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
      transition: all 0.3s ease;
      text-align: center;
      box-sizing: border-box;
    }

    select {
      direction: rtl;
    }

    select:focus, input:focus {
      border-color: #0A3D91;
      background-color: #eef6ff;
      outline: none;
      box-shadow: 0 0 5px rgba(10, 61, 145, 0.3);
    }

    button {
      background: linear-gradient(to right, #0A3D91, #2E8BFF);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      width: 90%;
      max-width: 400px;
      margin: 10px auto 0 auto;
      display: block;
      transition: background 0.3s ease;
      position: relative;
    }

    button:disabled {
      background: #a0b9dd;
      cursor: not-allowed;
    }

    button .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>תיעוד התייחסות לאירועים חשובים</h2>

    <form id="eventForm">
      <label for="eventSelect">בחר אירוע מהרשימה:</label>
      <select id="eventSelect" required>
        <option value="">— טוען אירועים... —</option>
      </select>

      <label for="referenceLink">קישור להתייחסות:</label>
      <input type="url" id="referenceLink" placeholder="https://example.com" required>

      <label for="nameInput">שם המתייחס:</label>
      <input type="text" id="nameInput" placeholder="שם פרטי ומשפחה" required>

      <label for="referenceTime">זמן ההתייחסות (בערך):</label>
      <input type="datetime-local" id="referenceTime" required>

      <button type="submit" id="submitButton">
        שלח
      </button>
    </form>
  </div>

  <script>
    const EVENT_LIST_URL = "https://script.google.com/macros/s/AKfycbz_zGLTaZU6_u474pJnLfBuJz4Dh4zTncpJpNhR7L2GYzqChX-OPMoqa1ATbKidSAnz/exec";
    const EVENT_SUBMIT_URL = "https://script.google.com/macros/s/AKfycbxjhQjYYJaF6MkBP26QCwW6Kyaf0fH08bz_98tzONswtgp0Nhs3JlcSjAWa7pVJc1c/exec";

    document.addEventListener("DOMContentLoaded", function () {
      const eventSelect = document.getElementById("eventSelect");
      const form = document.getElementById("eventForm");
      const submitButton = document.getElementById("submitButton");

      // שלב 1: טעינת רשימת האירועים
      fetch(EVENT_LIST_URL)
        .then(response => response.json())
        .then(events => {
          eventSelect.innerHTML = '<option value="">— בחר אירוע —</option>';
          events.forEach(event => {
            const option = document.createElement("option");
            option.value = event;
            option.textContent = event;
            eventSelect.appendChild(option);
          });

          const addNewOption = document.createElement("option");
          addNewOption.value = "__add_new__";
          addNewOption.textContent = "➕ הוסף אירוע חדש";
          eventSelect.appendChild(addNewOption);
        })
        .catch(error => {
          console.error("שגיאה בטעינת רשימת האירועים:", error);
          eventSelect.innerHTML = '<option disabled>אירעה שגיאה בטעינה</option>';
        });

      // שלב 2: הוספת אירוע חדש
      eventSelect.addEventListener("change", function () {
        if (eventSelect.value === "__add_new__") {
          const newEvent = prompt("הכנס שם אירוע חדש:");
          if (newEvent && newEvent.trim() !== "") {
            const formData = new URLSearchParams();
            formData.append("newEvent", newEvent.trim());

            fetch(EVENT_LIST_URL, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: formData.toString()
            })
            .then(response => response.text())
            .then(() => {
              alert("האירוע נוסף בהצלחה!");
              location.reload();
            })
            .catch(error => {
              console.error("שגיאה בהוספת אירוע:", error);
              alert("אירעה שגיאה בעת הוספת האירוע.");
              eventSelect.value = "";
            });
          } else {
            eventSelect.value = "";
          }
        }
      });

      // שלב 3: שליחת הטופס הרגילה
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const event = eventSelect.value;
        const link = document.getElementById("referenceLink").value.trim();
        const name = document.getElementById("nameInput").value.trim();
        const time = document.getElementById("referenceTime").value;

        if (!event || !link || !name || !time) {
          alert("אנא מלא את כל השדות הנדרשים.");
          return;
        }

        const formData = new URLSearchParams();
        formData.append("event", event);
        formData.append("link", link);
        formData.append("name", name);
        formData.append("time", time);

        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner"></span> שולח...';

        fetch(EVENT_SUBMIT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        })
        .then(response => response.text())
        .then(result => {
          alert("המידע נשלח בהצלחה!");
          form.reset();
        })
        .catch(error => {
          console.error("שגיאה בשליחה:", error);
          alert("אירעה שגיאה בשליחה. נסה שוב.");
        })
        .finally(() => {
          submitButton.disabled = false;
          submitButton.textContent = "שלח";
        });
      });
    });
  </script>

</body>
</html>
